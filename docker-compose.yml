name: rats-search

services:
  rats-search:
    build:
      context: .
    image: rats-search:local
    container_name: rats-search
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8097:8095"
      - "127.0.0.1:8098:8096"
      - "4445:4445/tcp"
      - "4445:4445/udp"
      - "4446:4446/tcp"
      - "4446:4446/udp"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8095'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
